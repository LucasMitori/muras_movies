# Local development datastore only. Backend and frontend run natively
# (uv run / pnpm dev) for fast reload; only PostgreSQL is containerized so
# nobody has to hand-configure a native Postgres superuser password.
#
# `name:` pins the Compose project name. This must differ from the root
# docker-compose.yml's project name ("muratori") — the full stack's postgres
# service is also named "postgres", and two compose files with the same
# project name produce the same container name ("muratori-postgres-1"), so
# starting this file would silently recreate/steal the full stack's running
# Postgres container out from under it. Learned the hard way: `docker compose
# -f ops/docker-compose.dev.yml up -d` while the full stack was running
# swapped the full stack's backend/web onto this file's (different, mostly
# empty) dev volume without warning beyond an easy-to-miss "orphan
# containers" note.
name: muratori-dev
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: muratori
      POSTGRES_PASSWORD: muratori
      POSTGRES_DB: muratori
    ports:
      # Host 5432 is already taken by a native PostgreSQL install on this
      # machine, so the container listens on 5433 on the host side.
      - "5433:5432"
    volumes:
      - muratori_postgres_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muratori -d muratori"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  muratori_postgres_dev:
    name: muratori_postgres_dev
